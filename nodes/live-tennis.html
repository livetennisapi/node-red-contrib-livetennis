<script type="text/javascript">
    RED.nodes.registerType("live tennis", {
        category: "network",
        color: "#D8E44E",
        icon: "live-tennis.svg",
        paletteLabel: "live tennis",
        inputs: 1,
        outputs: 1,
        defaults: {
            name: { value: "" },
            server: { value: "", type: "livetennis-config", required: true },
            operation: { value: "live", required: true },
            tour: { value: "" },
            player: { value: "" },
            country: { value: "" },
            from: { value: "" },
            to: { value: "" },
            limit: { value: "", validate: RED.validators.number(true) },
            matchId: { value: "", validate: RED.validators.number(true) },
            playerId: { value: "", validate: RED.validators.number(true) },
            search: { value: "" },
            p1: { value: "" },
            p2: { value: "" },
            playerName: { value: "" },
            system: { value: "" },
            asOf: { value: "" }
        },
        label: function () {
            return this.name || "live tennis: " + (this.operation || "live");
        },
        oneditprepare: function () {
            // show only the parameter rows that apply to the chosen operation
            const rows = {
                tour: ["live", "upcoming", "completed", "fixtures", "archive_matches", "archive_players"],
                player: ["live", "upcoming", "completed", "rankings"],
                country: ["live", "upcoming", "completed"],
                from: ["live", "upcoming", "completed", "archive_matches"],
                to: ["live", "upcoming", "completed", "archive_matches"],
                limit: ["live", "upcoming", "completed", "player_search", "fixtures",
                    "archive_matches", "archive_players", "rankings"],
                matchId: ["match", "score", "statistics"],
                playerId: ["player"],
                search: ["player_search"],
                p1: ["h2h"],
                p2: ["h2h"],
                playerName: ["archive_matches", "archive_players", "archive_career"],
                system: ["rankings"],
                asOf: ["rankings"]
            };
            function refresh() {
                const op = $("#node-input-operation").val();
                Object.keys(rows).forEach(function (field) {
                    $("#form-row-" + field).toggle(rows[field].indexOf(op) !== -1);
                });
            }
            $("#node-input-operation").on("change", refresh);
            refresh();
        }
    });
</script>

<script type="text/html" data-help-name="live tennis">
    <p>Queries the <a href="https://livetennisapi.com">Live Tennis API</a> for live,
       upcoming and completed matches, scores, match statistics, players, fixtures,
       head-to-head records, the 1968–2022 results archive and point-in-time
       rankings across ATP, WTA, Challenger, ITF and junior tours.</p>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dt class="optional">topic <span class="property-type">string</span></dt>
        <dd>overrides the configured operation: <code>live</code>, <code>upcoming</code>,
            <code>completed</code>, <code>match</code>, <code>score</code>,
            <code>statistics</code>, <code>player_search</code>, <code>player</code>,
            <code>fixtures</code>, <code>h2h</code>, <code>archive_matches</code>,
            <code>archive_players</code>, <code>archive_career</code>,
            <code>rankings</code> or <code>health</code>.</dd>
        <dt class="optional">payload <span class="property-type">object | number | string</span></dt>
        <dd>an object may carry <code>operation</code>, <code>tour</code>,
            <code>player</code>, <code>country</code>, <code>from</code>,
            <code>to</code>, <code>limit</code>, <code>offset</code>,
            <code>matchId</code>, <code>playerId</code>, <code>search</code>,
            <code>p1</code>, <code>p2</code>, <code>name</code>,
            <code>system</code>, <code>as_of</code>, <code>round</code> or
            <code>level</code> to override the node configuration. A bare number
            is used as the match/player id for the <code>match</code>,
            <code>score</code>, <code>statistics</code> and <code>player</code>
            operations; a bare string is the search text for
            <code>player_search</code> or the player name for
            <code>archive_career</code>.</dd>
    </dl>

    <h3>Outputs</h3>
    <dl class="message-properties">
        <dt>payload <span class="property-type">array | object</span></dt>
        <dd>flattened result. List operations output an array; match rows are
            flattened to <code>p1_name</code>, <code>p2_name</code>,
            <code>sets_p1/p2</code>, <code>games_p1/p2</code> (per-set arrays),
            <code>points_p1/p2</code>, <code>server</code> and so on.</dd>
        <dt class="optional">meta <span class="property-type">object</span></dt>
        <dd><code>{limit, offset, count}</code> on list operations.</dd>
        <dt>operation <span class="property-type">string</span></dt>
        <dd>the operation that produced this message.</dd>
    </dl>

    <h3>Details</h3>
    <p>Authentication uses the API key from the referenced
       <code>livetennis-config</code> node (stored in the Node-RED credential
       store, never exported with the flow). A free key — 100 requests/day,
       30/minute, no card — is available at
       <a href="https://livetennisapi.com/subscribe/free">livetennisapi.com/subscribe/free</a>.</p>
    <p>Data facts worth knowing: <code>points_p1/p2</code> are <b>strings</b>
       (<code>"0"</code>, <code>"15"</code>, <code>"40"</code>, <code>"A"</code>);
       <code>server</code> may be <code>null</code> when the feed doesn't know who
       serves; <code>score</code> fields are all <code>null</code> before a match
       starts; <code>games_p1/p2</code> are per-set arrays that grow as sets are
       played; on doubles, per-player biography (<code>data_completeness</code>)
       is <code>null</code> by design; on lower tours <code>round</code> often
       restates the tournament name; <code>fixtures</code> rows are name-only
       (players not yet resolved to ids).</p>
    <p>List filters (on <code>live</code>, <code>upcoming</code> and
       <code>completed</code>): <code>player</code> — id, repeatable up to 50
       (comma-separate in the editor field); <code>country</code> — lowercase
       3-letter IOC-style code (e.g. <code>ned</code>, <code>sui</code> — not
       ISO-3166); <code>from</code>/<code>to</code> — play dates
       (<code>YYYY-MM-DD</code> or ISO-8601 UTC datetime); <code>tour</code> —
       <code>atp</code>, <code>wta</code>, <code>challenger</code>,
       <code>itf</code> or <code>juniors</code>. An unknown filter value is a
       400 error, never silently ignored.</p>
    <p>Archive operations query the licensed 1968–2022 results corpus — a
       separate id space where people are keyed by <b>name</b> (fragment,
       min 3 characters), not by player ids; the archive <code>tour</code>
       filter accepts <code>atp</code> and <code>wta</code> only.
       <code>h2h</code> spans both the archive and our own completed matches
       (2023→now); an ambiguous name fragment is refused with the candidate
       list rather than merging two people into one record.</p>
    <p><code>rankings</code> has TWO modes: without <code>player</code> ids it
       returns the full published table in rank order for exactly one
       <code>system</code> (PRO); with <code>player</code> ids it returns
       point-in-time per-player records at <code>as_of</code> (ULTRA).
       <code>utr</code> is a rating, not a ranking — it has no listing mode.</p>
    <p>Tiers: <code>live</code>, <code>upcoming</code>, <code>match</code>,
       <code>score</code>, <code>player_search</code>, <code>player</code> and
       <code>fixtures</code> are on the FREE tier. Bulk completed-match
       listings (<code>completed</code>) need the BASIC tier ($9.99/mo) or any
       History plan — a FREE key gets a 403 <code>upgrade_required</code>;
       fetching a single completed match by id via <code>match</code> stays
       free. <code>h2h</code>, <code>archive_matches</code>,
       <code>archive_players</code> and <code>archive_career</code> also need
       BASIC ($9.99/mo) or any History plan. <code>rankings</code> listings
       need PRO ($29.99/mo); per-player rankings and <code>statistics</code>
       need ULTRA ($99.99/mo).</p>
    <p>Failures are reported through <code>node.error</code> (catchable with a
       <b>catch</b> node) with friendly messages: 401 bad key, 403 endpoint
       above your plan tier (naming the exact tier that unlocks it), 429 rate
       limit (with retry hint, and the daily reset instant when the day quota
       is spent). A 429 <code>abuse_throttled</code> means the key kept
       requesting long after its quota was spent and is blocked for 24 hours
       (until <code>retry_at_epoch</code>) — fix the retry loop to honour
       <code>Retry-After</code> instead of hammering.</p>
</script>
